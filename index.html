<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>照片墙</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="profile-bar">
      <img id="avatar" class="avatar hidden" src="" alt="头像">
      <div id="avatar-placeholder" class="avatar-placeholder">J</div>
      <span id="profile-name" class="profile-name">Jude</span>
    </div>
  </header>

  <main class="container">
    <div id="photo-wall" class="photo-wall"></div>
    <div id="empty-state" class="empty-state hidden">
      <p>还没有照片</p>
      <p>在 data.js 中添加照片数据</p>
    </div>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
